<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="" />
    <meta name="full-screen" content="true" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="game-config" content="./config/web_config.json" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>避难所：余烬纪元</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        min-height: 100dvh;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      canvas {
        display: block;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      input,
      textarea {
        touch-action: manipulation;
        -webkit-user-select: text;
        user-select: text;
      }

      #boot-status {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      #boot-status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-status" role="status" aria-live="polite"></div>
    <noscript>请启用 JavaScript 后进入《避难所：余烬纪元》。</noscript>
    <script type="module" src="/src/engine/main.ts"></script>
  </body>
</html>
